networks:
  kelder_net:
    name: kelder_net
    external: true

services:
  redis:
    image: redis:alpine
    container_name: redis
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - kelder_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kelder_api:
    build: .
    container_name: kelder_api
    privileged: true
    tty: true
    volumes:
      - /dev:/dev
      - ${HOST_PROJECT_ROOT:-.}/journey_history:/app/src/kelder_api/assets/
    devices:
      - /dev/gpiomem
      - /dev/mem
    cap_add:
      - SYS_RAWIO
    ports:
      - "8000:80"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kelder_net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: .
    privileged: true
    volumes:
      - ${HOST_PROJECT_ROOT:-.}/journey_history:/app/src/kelder_api/assets/
    environment:
      REDIS_HOST: redis
    devices:
      - "/dev/ttyAMA0:/dev/ttyAMA0"
      - "/dev/ttyS0:/dev/ttyS0"
    command: [ "uv", "run", "python", "-m", "src.kelder_api.app.background_orchestrator" ]
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - kelder_net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
